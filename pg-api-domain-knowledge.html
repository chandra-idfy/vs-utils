<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Gateway API — Domain Graph</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1f2630;
    --fg: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --accent: #58a6ff;
    --accent-soft: rgba(88,166,255,0.15);
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --code: #1f6feb;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --panel-2: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --green: #1a7f37;
      --orange: #9a6700;
      --red: #cf222e;
      --purple: #8250df;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
    font-size: 14px;
  }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  header .subtitle { color: var(--muted); font-size: 0.85rem; }
  header .stats { margin-left: auto; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  header .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.6rem;
    font-size: 0.8rem;
  }
  header .stat strong { color: var(--accent); }
  header input[type="search"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-size: 0.85rem;
    min-width: 220px;
  }
  header input[type="search"]:focus { outline: 2px solid var(--accent); }

  .main { display: grid; grid-template-columns: 280px 1fr 360px; min-height: 0; }
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 0.5rem;
  }
  .sidebar h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin: 0.75rem 0.5rem 0.25rem;
  }
  .domain-item {
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 0.25rem;
    transition: background 0.1s, border 0.1s;
  }
  .domain-item:hover { background: var(--panel-2); }
  .domain-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .domain-item .dn { font-weight: 600; }
  .domain-item .dc {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .complexity-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 0.4em;
    vertical-align: middle;
  }
  .complexity-simple { background: var(--green); }
  .complexity-moderate { background: var(--orange); }
  .complexity-complex { background: var(--red); }

  .canvas {
    overflow: auto;
    padding: 1rem 1.25rem 2rem;
    min-width: 0;
  }
  .canvas h2 {
    margin: 0.25rem 0 0.5rem;
    font-size: 1.4rem;
  }
  .canvas .domain-summary {
    color: var(--muted);
    margin-bottom: 1rem;
    max-width: 80ch;
  }
  .canvas .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
  }
  .tag {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.1em 0.7em;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .tag.entity { color: var(--purple); border-color: var(--purple); }
  .tag.rule { color: var(--orange); border-color: var(--orange); }

  .flow-card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    margin-bottom: 1rem;
  }
  .flow-card .flow-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
  }
  .flow-card .flow-name { font-weight: 600; flex-grow: 1; }
  .flow-card .flow-entry {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.15em 0.55em;
    border-radius: 4px;
  }
  .flow-card .flow-summary {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0.4rem 0 0.5rem;
    max-width: 80ch;
  }
  .flow-card .toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    padding: 0.1em 0.45em;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .steps {
    display: none;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
  }
  .flow-card.open .steps { display: block; }
  .step {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 0.65rem;
    padding: 0.5rem 0;
    align-items: start;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .step:last-child { border-bottom: 0; }
  .step:hover { background: var(--panel-2); }
  .step .num {
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: right;
    padding-top: 0.1rem;
  }
  .step .step-name { font-weight: 500; }
  .step .step-summary {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.1rem;
  }
  .step .step-file {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.74rem;
    color: var(--accent);
    margin-top: 0.2rem;
    word-break: break-all;
  }

  .details {
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 1rem 1.25rem;
  }
  .details h3 {
    margin: 0 0 0.4rem;
    font-size: 1rem;
  }
  .details .kicker {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.6px;
    margin-bottom: 0.15rem;
  }
  .details .section { margin-top: 1rem; }
  .details .section h4 {
    margin: 0 0 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .details ul { margin: 0; padding-left: 1.1rem; }
  .details li { margin: 0.15rem 0; }
  .details code, .step-file code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 0.1em 0.45em;
    border-radius: 4px;
    font-size: 0.83em;
  }
  .cross-edges { padding-left: 1.1rem; margin: 0; }
  .cross-edges li { margin: 0.4rem 0; }
  .cross-edges .target { color: var(--accent); cursor: pointer; }
  .cross-edges .target:hover { text-decoration: underline; }
  .cross-edges .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    padding: 2rem;
  }
  .placeholder svg { opacity: 0.4; }

  .hide { display: none !important; }

  /* Responsive */
  @media (max-width: 1100px) {
    .main { grid-template-columns: 240px 1fr; }
    .details { display: none; }
  }
  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { max-height: 200px; }
  }
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div>
    <h1>Profile Gateway API <span class="subtitle">— Domain Graph</span></h1>
  </div>
  <input type="search" id="search" placeholder="Search domains, flows, steps...">
  <div class="stats" id="stats"></div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <h2>Domains</h2>
    <div id="domain-list"></div>
  </aside>

  <section class="canvas" id="canvas">
    <div class="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
      <p style="margin-top:1rem;">Pick a domain on the left to explore its flows and steps.</p>
    </div>
  </section>

  <aside class="details" id="details">
    <div class="placeholder">Click a domain, flow, or step to see details.</div>
  </aside>
</div>

</div>

<script id="domain-data" type="application/json">{"project":{"name":"Profile Gateway API","languages":["elixir","json","yaml","shell"],"frameworks":["Phoenix","Phoenix Ecto","Phoenix PubSub","ExSM","GenRMQ","Redix","Canary"],"description":"Multi-tenant KYC/identity-verification gateway. Coordinates customer Profile creation, capture sessions (video/photo/document), verification Tasks, decisioning rules, and outbound calls to identity providers. Tenants configure flows declaratively through a JSONC Package DSL; Profile and Task lifecycles are governed by ExSM state machines and orchestrated across HTTP, WebSocket, RabbitMQ, and cron entry points.","analyzedAt":"2026-05-04T00:00:00Z","gitCommitHash":"5b387331b74ab317e3f7d0639ca95eeec9b91508"},"nodes":[{"id":"domain:profile-lifecycle-management","type":"domain","name":"Profile Lifecycle Management","summary":"The central aggregate of the gateway. Creates, transitions, searches, archives and purges customer Profile records, governing the legal status flow from pending through capture, review and completion via the Profile state machine and ProfileActions audit log.","tags":["profile","state-machine","kyc","core-domain","lifecycle"],"complexity":"complex","domainMeta":{"entities":["Profile","ProfileAction","ArchivedProfile","Snapshot","ProfileNotification"],"businessRules":["Profile status transitions are enforced by ExSM (Profiles.ProfileStateMachine); illegal transitions are rejected","Every profile is scoped to exactly one OrganizationUnit (tenant)","Profile create requests are validated against the active Package DSL via RequestParser","Reviewer/operator dispositions on a profile are recorded as immutable ProfileActions","Retention-expired profiles are archived into archived_profiles before purge"],"crossDomainInteractions":["Drives Verification Tasks domain (creates Tasks via TaskFactory using Package definition)","Drives KYC Capture & Artifacts domain (capture sessions are created from a Profile)","Reads Package DSL & Configuration to determine workflow at create time","Calls Decisioning & Rules to compute next-step transitions and priorities","Emits state-change events to Async Messaging (profile_transition_publisher, profiles_publisher)"]}},{"id":"domain:kyc-capture-and-artifacts","type":"domain","name":"KYC Capture & Artifacts","summary":"Handles end-user capture sessions (video, selfie, document) and the resulting artifacts. Issues capture session/auth tokens, manages reconnection windows, ingests uploaded media, generates signed storage URLs, and links Captures and Artifacts back to Tasks and Profiles.","tags":["capture","artifact","media","storage","session-token"],"complexity":"complex","domainMeta":{"entities":["Capture","Artifact","DocumentType","FactType","OverlayType","CaptureArtifact"],"businessRules":["Capture sessions are protected by short-lived auth and session tokens","Reconnect grace periods are enforced by ReconnectTerminationWorker; expired sockets terminate the capture","Artifacts are bound to both a Profile and a Capture, never freestanding","Recapture flows preserve prior artifacts as historical records","Signed URLs for storage objects are issued via IdfyStorageService"],"crossDomainInteractions":["Receives commands from Realtime Channels (capture_socket, session_channel, artifact_channel)","Calls External Provider Integrations (DocumentFetcher, Truesight) to extract facts and run liveness","Notifies Verification Tasks when captures complete so dependent tasks can advance","Persists media via IDfy Storage Service (outbound integration)"]}},{"id":"domain:verification-tasks-and-workflow","type":"domain","name":"Verification Tasks & Workflow","summary":"Each verification step (e.g. PAN fetch, face match, CKYC, video activity) is a Task. This domain manages the Task state machine, factory creation from Package definitions, retries, template binding, workflow-engine actions (initiate/complete/fail/copy), and routing to the correct provider integration.","tags":["task","workflow","state-machine","retry","verification"],"complexity":"complex","domainMeta":{"entities":["Task","TaskType","TaskRetry","Template","TaskSnapshot","TaskArtifact"],"businessRules":["Task transitions (queued \u2192 in_progress \u2192 processing \u2192 saved \u2192 completed/failed) are governed by TaskStateMachine","Tasks are instantiated by TaskFactory from the Profile's active Package configuration","Failed tasks are retried by TaskRetryProcessor up to per-task-type limits with backoff","Workflow actions on tasks are evaluated against rule_workflows by TaskWorkflowEngine","Task templates carry per-task-type validation and processor metadata"],"crossDomainInteractions":["Created from Profile Lifecycle (TaskFactory triggered on profile create)","Dispatches outbound calls to External Provider Integrations (Truesight, DocumentFetcher, IDfy360, ApiGateway, ConsentGateway)","Receives async callbacks via task_controller and human_workflow_controller","Drives Decisioning & Rules to resolve next workflow action","Publishes task-update webhooks to tenants"]}},{"id":"domain:package-dsl-and-configuration","type":"domain","name":"Package DSL & Configuration","summary":"Tenants configure their KYC flows declaratively via JSONC Package definitions. This domain owns the Package CRUD, parser tree (capture, review, AVKYC, SVKYC, video, risk, propensity, decision-engine slices), validation, version history, audit trails and feature-flag resolution.","tags":["package","dsl","configuration","parser","tenant-config"],"complexity":"complex","domainMeta":{"entities":["Package","PackageAuditTrail","OrganizationUnitPackage","Template","Translation","Theme"],"businessRules":["Every package edit is recorded in PackageAuditTrail with config snapshot and checksum","Packages are validated by Parser tree before activation; invalid configs are rejected","Decision-engine rule references inside packages must resolve to existing rule_workflows","Tasks declared inside a Package must be allowed for the OU (allowed-tasks gating)","Capture journey, review reasons, AVKYC, SVKYC, notifications and risk slices are validated by dedicated parsers"],"crossDomainInteractions":["Consumed by Profile Lifecycle (RequestParser validates create requests against Package)","Consumed by Verification Tasks (TaskFactory reads Package to instantiate Tasks)","References Decisioning & Rules (DecisionEngineValidator checks rule_workflow_ids)","Linked to OrganizationUnit via OrganizationUnitPackage join schema"]}},{"id":"domain:decisioning-and-rules","type":"domain","name":"Decisioning & Rules","summary":"Automated decisioning layer. Owns Rule, Ruleset and RuleWorkflow CRUD, the boolean expression evaluator (AND/OR/==/!=) that runs against profile/task/artifact data, the risk engine that routes high-risk profiles, the propensity engine that scores profiles, and the decision engine that produces auto-approve/auto-reject/manual-review outcomes.","tags":["rules","decision-engine","risk-engine","propensity","rule-workflow"],"complexity":"complex","domainMeta":{"entities":["Rule","Ruleset","RuleWorkflow","RiskEngineAction","PropensityEngineCore"],"businessRules":["Rule expressions evaluate against profile, task, and artifact sources and short-circuit on AND/OR","Risk engine actions can re-route VKYC tasks and update maker queues","Propensity scores are clamped to configured ranges and validated before propagation","Rule activation/deactivation is audit-logged via IdfyInstrumenter","RuleWorkflowEngine supports single-mode and multi-mode evaluation"],"crossDomainInteractions":["Invoked by Verification Tasks (TaskWorkflowEngine drives task actions from rule evaluations)","Invoked by Profile Lifecycle (ProfileWorkflow runs rules to choose the next status)","Invoked by Park Profile and UTV flows for queue/priority decisions","Referenced by Package DSL (decision-engine slice declares rule_workflow_ids)"]}},{"id":"domain:external-provider-integrations","type":"domain","name":"External Provider Integrations","summary":"Outbound boundary to identity-verification providers and internal IDfy microservices. Wraps Truesight (liveness/risk), DocumentFetcher (government documents), IDfy360, ConsentGateway, ApiGateway, ResolveTask (geo), Bandhan and Unity Bank orchestrators, plus storage and human-workflow services.","tags":["integrations","providers","outbound","truesight","document-fetcher"],"complexity":"complex","domainMeta":{"entities":["TruesightRequest","DocumentFetcher","Idfy360","ConsentGateway","ApiGateway","BandhanOrchestrator","UnityBankOrchestrator","IdfyStorageService"],"businessRules":["All outbound provider calls go through a shared HTTP request abstraction with retry, logging and error handling","Truesight async callbacks are processed by truesight_webhook_handler and update profile attempt state","DocumentFetcher decrypts and normalizes government-issued documents before persisting","Provider credentials and endpoints are resolved per-environment via api_gateway_config","Bandhan/Unity orchestrators chain multiple provider calls in a partner-specific sequence"],"crossDomainInteractions":["Called by Verification Tasks to execute provider work and write results back","Called by KYC Capture & Artifacts to fetch and decrypt documents during capture","Provider callbacks land on Web Boundary controllers and re-enter the task pipeline","Storage service is used by Reporting & Compliance for signed-URL provisioning"]}},{"id":"domain:tenant-and-access-control","type":"domain","name":"Tenant & Access Control","summary":"Multi-tenancy and authorization. Manages OrganizationUnits (tenants) and their configurations (theme, priority, assisted-call, enhanced review), Users, Roles and Permissions, payload-encryption KeyStores (DEK rotation), and the central abilities policy module enforced via Canary/Canada.","tags":["tenant","rbac","authorization","encryption","organization-unit"],"complexity":"complex","domainMeta":{"entities":["OrganizationUnit","OrganizationUnitConfiguration","User","Role","Permission","RolePermission","KeyStore"],"businessRules":["Every domain object is scoped to an OrganizationUnit (ou_id)","RBAC: Permissions group into Roles which are granted to Users","Per-OU encryption keys (DEK) are rotated and tracked with active/expired status in KeyStore","abilities.ex declaratively answers can?(user, action, resource) for every controller","PubSub-driven role/user grants from an upstream admin service ingest into role_controller"],"crossDomainInteractions":["Gates every HTTP/WebSocket entry point through Canary plug \u2192 abilities.ex","Provides per-OU configuration consumed by Profile Lifecycle, Package DSL and Decisioning","Supplies encryption keys consumed by PayloadEncryption on /enc endpoints","Themes and Translations are tenant-scoped and consumed by capture UI"]}},{"id":"domain:realtime-and-operator-console","type":"domain","name":"Realtime Channels & Operator Console","summary":"Phoenix WebSocket layer used by capture clients, agents and reviewer operator dashboards. Routes session lifecycle events, artifact updates, notifications and presence tracking; carries the bulk of capture-time interactions including liveness, GPS, page tracking, error reporting and human-review actions.","tags":["websocket","channels","realtime","presence","operator"],"complexity":"complex","domainMeta":{"entities":["CaptureSocket","AgentSocket","ProfileSocket","SessionChannel","ArtifactChannel","NotificationChannel","TaskChannel","Presence"],"businessRules":["Capture sockets validate the capture session token before accepting any message","Agent sockets authenticate via x-account-id header and require :submit_review ability","NotificationChannel uses Phoenix.Presence to track reviewer connections and signal tab-closed reconciliation","session_channel handles 30+ message types covering the full capture lifecycle","Channel terminations can be forced via the testing controller for support workflows"],"crossDomainInteractions":["Calls KYC Capture & Artifacts (captures, artifacts, recapture)","Calls Verification Tasks (task:initiate, terminate_channel)","Calls External Provider Integrations (DocumentFetcher, DIV/PAN flows from artifact_channel)","Drives operator-side Park Profile, UTV and AssistedVKYC actions"]}},{"id":"domain:async-messaging-and-webhooks","type":"domain","name":"Async Messaging & Webhooks","summary":"Fire-and-forget side of the system. RabbitMQ consumers/publishers handle profile transitions, archival, purge, PDF notifications, Truesight evaluation requests and report generation; outbound webhooks sign and POST profile/task/session updates to tenants' callback URLs.","tags":["rabbitmq","webhooks","redis","async","publisher","consumer"],"complexity":"complex","domainMeta":{"entities":["ProfileTransitionConsumer","ProfileTransitionPublisher","AutoPurgeConsumer","AutoPurgePublisher","PdfNotifyConsumer","ProfileArchivalConsumer","ProfilesPublisher","ReportsPublisher","TruesightPublisher","SessionUpdateWebhook","TaskUpdateWebhook","RedixPool"],"businessRules":["Profile transitions are processed under a per-profile lock with bounded retries","Failed lock acquisitions re-enqueue the message via profile_transition_publisher","Webhooks are idempotency-tracked to avoid duplicate notifications to tenants","Auto-purge messages remove artifacts on retention expiry; non-DEK queue handles separate cleanup","Redis is used for caching, locks and ephemeral session/keep-alive data"],"crossDomainInteractions":["Receives state-change emissions from Profile Lifecycle and Verification Tasks","Triggers Reporting, Snapshots & Compliance (PDF generation, archival)","Sends webhooks describing changes from Profile Lifecycle, Verification Tasks and Realtime Channels","Hands off to External Provider Integrations (truesight_publisher \u2192 Truesight risk service)"]}},{"id":"domain:reporting-snapshots-and-compliance","type":"domain","name":"Reporting, Snapshots & Compliance","summary":"Aud ny previously open task for the same profile slot","UTV artifacts support agent-video and customer-video links with signed-URL access","UTV tasks track retry counts independently from regular Task retries","Video composition is triggered explicitly from the UTV dashboard endpoint"],"crossDomainInteractions":["Wraps Verification Tasks (UTV tasks coexist with regular Tasks but are routed differently)","Reads from KYC Capture & Artifacts (uses captured media as UTV input)","Surface flows to Realtime Channels & Operator Console for reviewer dashboard","Reuses External Provider Integrations for video composition output"]}},{"id":"flow:create-profile","type":"flow","name":"Create Profile","summary":"Tenant creates a new KYC profile via REST. The request is validated against the active Package, Tasks are factory-created, capture link is issued, and the profile enters the state machine.","tags":["profile","create","http"],"complexity":"complex","domainMeta":{"entryPoint":"POST /ext/profiles (profile_controller :create_sync / :create_async)","entryType":"http"}},{"id":"flow:profile-state-transition","type":"flow","name":"Profile State Transition","summary":"Async profile state changes flowing through RabbitMQ. Each transition acquires a per-profile lock, applies the ExSM transition with side effects, and re-publishes on lock failure.","tags":["profile","state-machine","rabbitmq"],"complexity":"complex","domainMeta":{"entryPoint":"RabbitMQ profile_transition queue (profile_transition_consumer)","entryType":"event"}},{"id":"flow:profile-search","type":"flow","name":"Profile Search & Reviewer Dashboards","summary":"Reviewer-facing search across profiles supporting reference_id, status, OU, date range, package, reviewer, profile_tag and capture-data filters; specialised endpoints for review_pending, scheduled appointments and task-based queries.","tags":["profile","search","dashboard","reviewer"],"complexity":"moderate","domainMeta":{"entryPoint":"GET /ext/profiles + /profiles/s <script>
(function() {
  const DATA = JSON.parse(document.getElementById('domain-data').textContent);
  const nodes = DATA.nodes;
  const edges = DATA.edges;
  const project = DATA.project || {};

  const byId = new Map(nodes.map(n => [n.id, n]));
  const domains = nodes.filter(n => n.type === 'domain');
  const flows = nodes.filter(n => n.type === 'flow');
  const steps = nodes.filter(n => n.type === 'step');

  // Build adjacency: domain -> flows, flow -> ordered steps
  const flowsByDomain = new Map();
  const stepsByFlow = new Map();
  const crossByDomain = new Map();
  for (const e of edges) {
    if (e.type === 'contains_flow') {
      if (!flowsByDomain.has(e.source)) flowsByDomain.set(e.source, []);
      flowsByDomain.get(e.source).push(e.target);
    } else if (e.type === 'flow_step') {
      if (!stepsByFlow.has(e.source)) stepsByFlow.set(e.source, []);
      stepsByFlow.get(e.source).push({ id: e.target, w: e.weight ?? 0 });
    } else if (e.type === 'cross_domain') {
      if (!crossByDomain.has(e.source)) crossByDomain.set(e.source, []);
      crossByDomain.get(e.source).push(e);
    }
  }
  for (const arr of stepsByFlow.values()) arr.sort((a, b) => a.w - b.w);

  // Header stats
  const stats = document.getElementById('stats');
  stats.innerHTML = [
    ['Domains', domains.length],
    ['Flows', flows.length],
    ['Steps', steps.length],
  ].map(([k,v]) => `<div class="stat">${k} <strong>${v}</strong></div>`).join('') +
    `<div class="stat">${(project.languages||[]).slice(0,3).join(' · ')}</div>`;

  // Sidebar render
  const sidebar = document.getElementById('domain-list');
  function renderSidebar(filter) {
    const f = (filter || '').trim().toLowerCase();
    const items = domains.map(d => {
      const flowCount = (flowsByDomain.get(d.id) || []).length;
      const matches = !f ||
        d.name.toLowerCase().includes(f) ||
        d.summary.toLowerCase().includes(f) ||
        (d.tags || []).join(' ').toLowerCase().includes(f);
      if (!matches) return '';
      return `<div class="domain-item" data-id="${d.id}">
        <div class="dn"><span class="complexity-dot complexity-${d.complexity}"></span>${escapeHtml(d.name)}</div>
        <div class="dc">${flowCount} flow${flowCount===1?'':'s'} · ${(d.tags||[]).slice(0,3).join(' · ')}</div>
      </div>`;
    }).join('');
    sidebar.innerHTML = items || `<div class="dc" style="padding:0.5rem;color:var(--muted);">No matches.</div>`;
  }
  renderSidebar('');

  sidebar.addEventListener('click', (e) => {
    const item = e.target.closest('.domain-item');
    if (!item) return;
    document.querySelectorAll('.domain-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    selectDomain(item.dataset.id);
  });

  document.getElementById('search').addEventListener('input', (e) => {
    renderSidebar(e.target.value);
  });

  // Canvas render: domain -> flow cards -> steps
  const canvas = document.getElementById('canvas');
  function selectDomain(id) {
    const d = byId.get(id);
    if (!d) return;
    showInDetails(d);
    const meta = d.domainMeta || {};
    const flowIds = flowsByDomain.get(id) || [];

    let html = '';
    html += `<h2><span class="complexity-dot complexity-${d.complexity}"></span>${escapeHtml(d.name)}</h2>`;
    html += `<div class="domain-summary">${escapeHtml(d.summary)}</div>`;
    html += `<div class="meta-row">`;
    (d.tags || []).forEach(t => { html += `<span class="tag">${escapeHtml(t)}</span>`; });
    (meta.entities || []).forEach(t => { html += `<span class="tag entity">${escapeHtml(t)}</span>`; });
    html += `</div>`;

    flowIds.forEach(fid => {
      const flow = byId.get(fid);
      if (!flow) return;
      const fmeta = flow.domainMeta || {};
      const stepArr = stepsByFlow.get(fid) || [];
      html += `<div class="flow-card" data-id="${flow.id}">
        <div class="flow-header">
          <span class="complexity-dot complexity-${flow.complexity}"></span>
          <span class="flow-name">${escapeHtml(flow.name)}</span>
          ${fmeta.entryPoint ? `<span class="flow-entry">${escapeHtml(fmeta.entryPoint)}</span>` : ''}
          <button class="toggle" type="button">${stepArr.length} step${stepArr.length===1?'':'s'} ▾</button>
        </div>
        <div class="flow-summary">${escapeHtml(flow.summary)}</div>
        <div class="steps">${
          stepArr.map((s, i) => {
            const node = byId.get(s.id);
            if (!node) return '';
            return `<div class="step" data-id="${node.id}">
              <div class="num">${i+1}</div>
              <div>
                <div class="step-name"><span class="complexity-dot complexity-${node.complexity}"></span>${escapeHtml(node.name)}</div>
                <div class="step-summary">${escapeHtml(node.summary)}</div>
                ${node.filePath ? `<div class="step-file">${escapeHtml(node.filePath)}</div>` : ''}
              </div>
            </div>`;
          }).join('')
        }</div>
      </div>`;
    });
    canvas.innerHTML = html;

    canvas.querySelectorAll('.flow-card').forEach(card => {
      card.querySelector('.flow-header').addEventListener('click', (ev) => {
        if (ev.target.tagName !== 'BUTTON' && !ev.target.classList.contains('toggle')) {
          // Selecting flow => details
          const fid = card.dataset.id;
          const node = byId.get(fid);
          if (node) showInDetails(node);
        }
        card.classList.toggle('open');
      });
      card.querySelectorAll('.step').forEach(s => {
        s.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const node = byId.get(s.dataset.id);
          if (node) showInDetails(node);
        });
      });
    });
  }

  // Right-side details panel
  const details = document.getElementById('details');
  function showInDetails(node) {
    let html = `<div class="kicker">${node.type}</div>`;
    html += `<h3><span class="complexity-dot complexity-${node.complexity}"></span>${escapeHtml(node.name)}</h3>`;
    html += `<div style="color:var(--muted);">${escapeHtml(node.summary || '')}</div>`;

    if ((node.tags || []).length) {
      html += `<div class="section"><h4>Tags</h4><div class="meta-row">${node.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div>`;
    }

    const m = node.domainMeta || {};

    if (node.type === 'domain') {
      if ((m.entities || []).length) {
        html += `<div class="section"><h4>Entities</h4><div class="meta-row">${m.entities.map(t => `<span class="tag entity">${escapeHtml(t)}</span>`).join('')}</div></div>`;
      }
      if ((m.businessRules || []).length) {
        html += `<div class="section"><h4>Business Rules</h4><ul>${m.businessRules.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul></div>`;
      }
      const cross = crossByDomain.get(node.id) || [];
      if (cross.length) {
        html += `<div class="section"><h4>Cross-Domain Interactions</h4><ul class="cross-edges">${
          cross.map(e => {
            const targetNode = byId.get(e.target);
            if (!targetNode) return '';
            return `<li><span class="target" data-id="${e.target}">→ ${escapeHtml(targetNode.name)}</span><div class="desc">${escapeHtml(e.description || '')}</div></li>`;
          }).join('')
        }</ul></div>`;
      }
      // Inbound cross
      const inbound = edges.filter(e => e.type === 'cross_domain' && e.target === node.id);
      if (inbound.length) {
        html += `<div class="section"><h4>Incoming Interactions</h4><ul class="cross-edges">${
          inbound.map(e => {
            const sourceNode = byId.get(e.source);
            if (!sourceNode) return '';
            return `<li><span class="target" data-id="${e.source}">← ${escapeHtml(sourceNode.name)}</span><div class="desc">${escapeHtml(e.description || '')}</div></li>`;
          }).join('')
        }</ul></div>`;
      }
      const flowIds = flowsByDomain.get(node.id) || [];
      if (flowIds.length) {
        html += `<div class="section"><h4>Flows (${flowIds.length})</h4><ul>${
          flowIds.map(fid => {
            const f = byId.get(fid);
            return f ? `<li>${escapeHtml(f.name)}</li>` : '';
          }).join('')
        }</ul></div>`;
      }
    } else if (node.type === 'flow') {
      if (m.entryPoint) html += `<div class="section"><h4>Entry Point</h4><code>${escapeHtml(m.entryPoint)}</code></div>`;
      if (m.entryType) html += `<div class="section"><h4>Entry Type</h4><span class="tag">${escapeHtml(m.entryType)}</span></div>`;
      const stepArr = stepsByFlow.get(node.id) || [];
      if (stepArr.length) {
        html += `<div class="section"><h4>Steps (${stepArr.length})</h4><ol>${
          stepArr.map(s => {
            const sn = byId.get(s.id);
            return sn ? `<li>${escapeHtml(sn.name)}</li>` : '';
          }).join('')
        }</ol></div>`;
      }
    } else if (node.type === 'step') {
      if (node.filePath) html += `<div class="section"><h4>Source</h4><code>${escapeHtml(node.filePath)}</code></div>`;
    }

    details.innerHTML = html;
    details.querySelectorAll('.cross-edges .target').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        document.querySelectorAll('.domain-item').forEach(d => d.classList.toggle('active', d.dataset.id === id));
        const target = document.querySelector(`.domain-item[data-id="${CSS.escape(id)}"]`);
        if (target) target.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        selectDomain(id);
      });
    });
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Auto-select first domain
  if (domains.length) {
    const firstItem = sidebar.querySelector('.domain-item');
    if (firstItem) {
      firstItem.classList.add('active');
      selectDomain(domains[0].id);
    }
  }
})();
</script>
</body>
</html>

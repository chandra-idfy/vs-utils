<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

:root{
  /* === Color tokens === */
  --color-primary:#006666;
  --color-secondary:#F1F2F5;
  --color-success:#00A63D;
  --color-warning:#FE9900;
  --color-danger:#FF2157;
  --color-info:#0C447C;
  --color-surface:#E7E5E4;
  --color-text:#1E2938;

  /* Derived */
  --color-bg:#FAFAF8;
  --color-text-muted:#4F5C6B;
  --color-text-faint:#7C8794;
  --color-border:rgba(30,41,56,0.16);
  --color-border-strong:rgba(30,41,56,0.32);
  --color-border-dashed:rgba(0,102,102,0.32);

  /* Tints */
  --tint-primary:rgba(0,102,102,0.08);
  --tint-primary-2:rgba(0,102,102,0.16);
  --tint-success:rgba(0,166,61,0.10);
  --tint-warning:rgba(254,153,0,0.12);
  --tint-danger:rgba(255,33,87,0.08);
  --tint-info:rgba(12,68,124,0.08);

  /* Compact spacing scale */
  --s-1:4px;
  --s-2:8px;
  --s-3:12px;
  --s-4:16px;
  --s-5:20px;
  --s-6:24px;

  /* Type */
  --font-display:'Space Mono', ui-monospace, Menlo, monospace;
  --font-body:'Space Mono', ui-monospace, Menlo, monospace;
  --font-tech:'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, monospace;

  /* Radius — sharp, terminal-leaning */
  --r-xs:2px;
  --r-sm:3px;
  --r-md:4px;
  --r-pill:99px;

  /* Motion */
  --ease:cubic-bezier(0.2,0.7,0.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-body);
  color:var(--color-text);
  background:transparent;
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01","cv01";
}

/* ========== TOP BAR ========== */
.top-bar{
  display:flex;
  align-items:center;
  gap:var(--s-2);
  padding:var(--s-3) var(--s-4) var(--s-3);
  border-bottom:1px solid var(--color-border);
  flex-wrap:wrap;
  background:linear-gradient(180deg, transparent, var(--tint-primary) 200%);
}
.top-bar-title{
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
  letter-spacing:-0.01em;
  color:var(--color-text);
  flex:1;
  min-width:160px;
  display:flex;
  align-items:center;
  gap:var(--s-1);
}
.top-bar-title::before{
  content:">";
  color:var(--color-primary);
  font-weight:700;
  margin-right:2px;
}
.top-bar-title .cursor{
  display:inline-block;
  width:7px;
  height:14px;
  background:var(--color-primary);
  margin-left:3px;
  animation:blink 1.1s steps(2,end) infinite;
  vertical-align:-2px;
}
@keyframes blink{50%{opacity:0}}

.pkg-select{
  padding:5px 10px;
  border:1px solid var(--color-border-strong);
  border-radius:var(--r-sm);
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-tech);
  font-size:12px;
  cursor:pointer;
}

.top-btn{
  padding:6px 12px;
  border:1px solid var(--color-border-strong);
  border-radius:var(--r-sm);
  background:transparent;
  color:var(--color-text);
  font-family:var(--font-tech);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:background 0.12s var(--ease), border-color 0.12s var(--ease), transform 0.08s var(--ease);
  letter-spacing:0.01em;
}
.top-btn:hover{
  background:var(--color-surface);
  border-color:var(--color-text);
}
.top-btn:active{transform:translateY(1px)}
.top-btn:focus-visible{
  outline:2px solid var(--color-primary);
  outline-offset:2px;
}
.top-btn.primary{
  border-color:var(--color-primary);
  color:#FFFFFF;
  background:var(--color-primary);
}
.top-btn.primary:hover{
  background:#004F4F;
  border-color:#004F4F;
}

/* ========== LEGEND ========== */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:var(--s-3);
  padding:var(--s-2) var(--s-4);
  border-bottom:1px solid var(--color-border);
  background:var(--color-secondary);
}
.leg-item{
  display:flex;
  align-items:center;
  gap:var(--s-1);
  font-family:var(--font-tech);
  font-size:11px;
  color:var(--color-text-muted);
  font-weight:500;
}
.leg-item::before{
  content:"[";
  color:var(--color-text-faint);
  margin-right:1px;
}
.leg-item::after{
  content:"]";
  color:var(--color-text-faint);
  margin-left:1px;
}
.leg-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  flex-shrink:0;
}
.leg-square{
  width:8px;
  height:8px;
  border-radius:var(--r-xs);
  flex-shrink:0;
}
.leg-pip{
  width:9px;
  height:9px;
  border-radius:var(--r-pill);
  display:inline-block;
  flex-shrink:0;
}

/* ========== FILE CHIPS ========== */
.file-chips{
  display:flex;
  flex-wrap:wrap;
  gap:var(--s-1);
  padding:var(--s-2) var(--s-4);
  border-bottom:1px solid var(--color-border);
  background:var(--color-bg);
}
.chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 4px 4px 10px;
  border-radius:var(--r-sm);
  font-family:var(--font-tech);
  font-size:12px;
  background:var(--color-surface);
  border:1px solid var(--color-border);
  color:var(--color-text-muted);
  cursor:pointer;
  transition:background 0.12s var(--ease), border-color 0.12s var(--ease), color 0.12s var(--ease);
  max-width:280px;
}
.chip:hover{
  border-color:var(--color-primary);
  color:var(--color-text);
}
.chip > span:first-of-type{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.chip-remove{
  cursor:pointer;
  width:18px;
  height:18px;
  border-radius:var(--r-xs);
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  color:var(--color-text-muted);
  font-size:11px;
  flex-shrink:0;
  transition:background 0.12s var(--ease), color 0.12s var(--ease);
}
.chip-remove:hover{
  background:var(--tint-danger);
  color:var(--color-danger);
}
.chip.active{
  background:var(--color-primary);
  color:#FFFFFF;
  border-color:var(--color-primary);
}
.chip.active::before{
  content:"●";
  color:#FFFFFF;
  margin-right:2px;
  font-size:9px;
}
.chip.active .chip-remove{
  color:rgba(255,255,255,0.8);
}
.chip.active .chip-remove:hover{
  background:rgba(255,255,255,0.18);
  color:#FFFFFF;
}

/* ========== ERROR BAR ========== */
.err-bar{
  padding:var(--s-2) var(--s-4);
  background:var(--tint-danger);
  border-bottom:1px solid var(--color-danger);
  border-left:3px solid var(--color-danger);
  font-family:var(--font-tech);
  font-size:12px;
  color:#A8132F;
  display:none;
  font-weight:500;
}
.err-bar::before{
  content:"! ";
  color:var(--color-danger);
  font-weight:700;
}

/* ========== UPLOAD ZONE ========== */
.upload-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:var(--s-2);
  padding:var(--s-6) var(--s-4);
  border:1.5px dashed var(--color-border-dashed);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:border-color 0.15s var(--ease), background 0.15s var(--ease), transform 0.15s var(--ease);
  background:var(--color-bg);
  margin:var(--s-4);
  position:relative;
  overflow:hidden;
}
.upload-zone::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(var(--tint-primary) 1px, transparent 1px),
    linear-gradient(90deg, var(--tint-primary) 1px, transparent 1px);
  background-size:24px 24px;
  background-position:-1px -1px;
  opacity:0.4;
  pointer-events:none;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
}
.upload-zone:hover,.upload-zone.drag-over{
  border-color:var(--color-primary);
  background:var(--tint-primary);
}
.upload-zone:hover .upload-icon,
.upload-zone.drag-over .upload-icon{
  background:var(--color-primary);
  color:#FFFFFF;
  transform:translateY(-1px);
}
.upload-zone > *{position:relative}
.upload-icon{
  width:36px;
  height:36px;
  border-radius:var(--r-sm);
  background:var(--color-surface);
  color:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.15s var(--ease), color 0.15s var(--ease), transform 0.15s var(--ease);
}
.upload-title{
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
  color:var(--color-text);
  letter-spacing:-0.01em;
}
.upload-title::before{content:"[ "; color:var(--color-primary)}
.upload-title::after{content:" ]"; color:var(--color-primary)}
.upload-sub{
  font-family:var(--font-tech);
  font-size:12px;
  color:var(--color-text-muted);
  text-align:center;
}
.upload-note{
  font-family:var(--font-tech);
  font-size:11px;
  color:var(--color-text-faint);
  text-align:center;
  max-width:340px;
  line-height:1.55;
}
input[type=file]{display:none}

/* ========== TREE ========== */
.tree-root{
  padding:var(--s-3) var(--s-4) var(--s-6);
}
.empty-state{
  text-align:center;
  padding:var(--s-6) var(--s-4);
  color:var(--color-text-muted);
  font-family:var(--font-tech);
  font-size:12px;
}
.empty-state::before{
  content:"// ";
  color:var(--color-text-faint);
}

.phase-block{margin-bottom:0}
.phase-row{
  display:flex;
  align-items:center;
  gap:0;
  cursor:pointer;
  user-select:none;
  padding:var(--s-2) var(--s-1);
  border-bottom:1px dashed var(--color-border);
  min-height:36px;
  transition:background 0.1s var(--ease);
  border-radius:var(--r-xs);
}
.phase-row:hover{background:var(--tint-primary)}
.phase-row:hover .phase-label{color:var(--color-primary)}
.phase-row:focus-visible{
  outline:2px solid var(--color-primary);
  outline-offset:-2px;
}

.v-line-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:22px;
  flex-shrink:0;
  align-self:stretch;
}
.v-line{width:1px;flex:1;background:var(--color-border)}
.v-line.phase-line{
  background-image:linear-gradient(var(--color-border-dashed) 50%, transparent 50%);
  background-size:1px 4px;
  background-color:transparent;
}
.v-line.invis{background:transparent;background-image:none}

.phase-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex-shrink:0;
  margin-top:3px;
  background:var(--color-primary);
  box-shadow:0 0 0 3px var(--tint-primary-2);
}
.phase-label{
  font-family:var(--font-display);
  font-size:13px;
  font-weight:700;
  flex:1;
  padding-left:var(--s-2);
  color:var(--color-text);
  letter-spacing:-0.005em;
}
.phase-count{
  font-family:var(--font-tech);
  font-size:11px;
  color:var(--color-text-muted);
  padding-right:var(--s-1);
  font-weight:500;
}
.phase-count::before{content:"("; color:var(--color-text-faint)}
.phase-count::after{content:")"; color:var(--color-text-faint)}

.chevron{
  width:18px;
  height:18px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.18s var(--ease);
  color:var(--color-text-muted);
  font-family:var(--font-tech);
  font-size:11px;
  font-weight:600;
}
.chevron.open{transform:rotate(90deg)}

.children{overflow:hidden}

.card-row{
  display:flex;
  align-items:flex-start;
  gap:0;
  cursor:pointer;
  padding:6px 4px 6px 0;
  padding-left:22px;
  min-height:32px;
  border-radius:var(--r-xs);
  transition:background 0.1s var(--ease);
}
.card-row:hover{background:var(--tint-success)}
.card-row:hover .card-label{color:var(--color-success)}
.card-row:focus-visible{
  outline:2px solid var(--color-success);
  outline-offset:-2px;
}

.card-dot{
  width:9px;
  height:9px;
  border-radius:var(--r-xs);
  flex-shrink:0;
  margin-top:4px;
}
.card-label{
  font-family:var(--font-body);
  font-size:13px;
  color:var(--color-text);
  flex:1;
  padding-left:var(--s-2);
  font-weight:400;
  word-break:break-word;
}
.card-label.open-label{
  color:var(--color-text);
  font-weight:700;
}
.card-count{
  font-family:var(--font-tech);
  font-size:11px;
  color:var(--color-text-muted);
  padding-right:var(--s-1);
  white-space:nowrap;
}

/* ========== TASKS ========== */
.task-list{
  padding-left:64px;
  padding-bottom:var(--s-1);
  background:linear-gradient(90deg, var(--tint-warning), transparent 4%);
}
.task-row{
  display:flex;
  align-items:flex-start;
  gap:var(--s-2);
  padding:6px 0;
  border-bottom:1px dotted var(--color-border);
}
.task-row:last-child{border-bottom:none}
.task-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0;
  margin-top:6px;
  background:var(--color-warning);
  box-shadow:0 0 0 2px var(--tint-warning);
}
.task-text{
  flex:1;
  font-family:var(--font-tech);
  font-size:12px;
  color:var(--color-text);
  line-height:1.55;
  word-break:break-word;
}
.badges{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  flex-shrink:0;
  align-self:flex-start;
  margin-top:1px;
}
.badge{
  padding:2px 7px;
  border-radius:var(--r-pill);
  font-family:var(--font-tech);
  font-size:10px;
  font-weight:600;
  letter-spacing:0.02em;
  white-space:nowrap;
  border:1px solid transparent;
}
.b-req{
  background:var(--tint-warning);
  color:#7A4400;
  border-color:rgba(254,153,0,0.4);
}
.b-req::before{content:"● "; font-size:7px; vertical-align:middle}
.b-opt{
  background:var(--tint-info);
  color:var(--color-info);
  border-color:rgba(12,68,124,0.3);
}
.b-opt::before{content:"○ "; font-size:8px; vertical-align:middle}
.b-fail{
  background:var(--tint-danger);
  color:#A8132F;
  border-color:rgba(255,33,87,0.4);
}
.b-fail::before{content:"× "; font-weight:700}
.b-type{
  background:var(--color-secondary);
  color:var(--color-text-muted);
  border-color:var(--color-border);
  font-family:var(--font-tech);
}

/* ========== REJECT / FLAGS ========== */
.reject-list{
  padding-left:22px;
  padding-bottom:var(--s-2);
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding-top:var(--s-1);
}
.reject-pill{
  padding:3px 9px;
  border-radius:var(--r-pill);
  font-family:var(--font-tech);
  font-size:11px;
  background:var(--tint-danger);
  color:#A8132F;
  border:1px solid rgba(255,33,87,0.35);
  font-weight:500;
}
.reject-pill::before{content:"× "; font-weight:700}

.flag-list{
  padding-left:22px;
  padding-bottom:var(--s-2);
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding-top:var(--s-1);
}
.flag-pill{
  padding:3px 9px;
  border-radius:var(--r-pill);
  font-family:var(--font-tech);
  font-size:11px;
  border:1px solid var(--color-border);
  background:var(--color-secondary);
  color:var(--color-text-muted);
  font-weight:500;
}
.flag-pill.on{
  background:var(--tint-success);
  color:#005A20;
  border-color:rgba(0,166,61,0.4);
}
.flag-pill::before{
  content:"○ ";
  color:var(--color-text-faint);
}
.flag-pill.on::before{
  content:"● ";
  color:var(--color-success);
}

.tc-lines{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:22px;
  flex-shrink:0;
  align-self:stretch;
}

/* ========== RESPONSIVE ========== */
@media (max-width:520px){
  .top-bar{padding:var(--s-2) var(--s-3)}
  .legend{padding:var(--s-2) var(--s-3); gap:var(--s-2)}
  .file-chips{padding:var(--s-2) var(--s-3)}
  .upload-zone{margin:var(--s-3); padding:var(--s-5) var(--s-3)}
  .tree-root{padding:var(--s-2) var(--s-3) var(--s-5)}
  .task-list{padding-left:44px}
  .badges{margin-top:var(--s-1)}
  .leg-item{font-size:10px}
}
</style>

<div class="top-bar">
  <div class="top-bar-title" id="topTitle">vkyc.workflow_explorer<span class="cursor"></span></div>
  <select class="pkg-select" id="pkgSel" onchange="selectPkg(this.value)" style="display:none"></select>
  <button class="top-btn" id="expandBtn" onclick="toggleAll()" style="display:none">expand all</button>
  <label for="fileInput" class="top-btn primary" id="uploadBtn">+ upload json</label>
  <input type="file" id="fileInput" accept=".json,application/json" multiple>
</div>

<div class="err-bar" id="errBar"></div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--color-primary)"></div>phase</div>
  <div class="leg-item"><div class="leg-square" style="background:var(--color-success)"></div>check card</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--color-warning)"></div>task</div>
  <div class="leg-item"><span class="leg-pip" style="background:var(--tint-warning);border:1px solid rgba(254,153,0,0.4)"></span>required</div>
  <div class="leg-item"><span class="leg-pip" style="background:var(--tint-info);border:1px solid rgba(12,68,124,0.3)"></span>optional</div>
  <div class="leg-item"><span class="leg-pip" style="background:var(--tint-danger);border:1px solid rgba(255,33,87,0.4)"></span>fails call</div>
</div>

<div id="fileChips" class="file-chips" style="display:none"></div>

<div id="uploadArea">
  <div class="upload-zone" id="dropZone" tabindex="0" role="button" aria-label="Upload package JSON files">
    <div class="upload-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 13V4M10 4L7 7M10 4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 14v1a2 2 0 002 2h10a2 2 0 002-2v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="upload-title">upload package json</div>
    <div class="upload-sub">click to browse · or drag &amp; drop</div>
    <div class="upload-note">drop one or more package json files. each file appears as a tab. supports the standard vkyc package format.</div>
  </div>
</div>

<div class="tree-root" id="treeRoot">
  <div class="empty-state">upload a package json file above to visualise its workflow.</div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function(){ handleFiles(this.files); });
document.getElementById('dropZone').addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('drag-over'); });
document.getElementById('dropZone').addEventListener('dragleave', function(){ this.classList.remove('drag-over'); });
document.getElementById('dropZone').addEventListener('drop', function(e){ e.preventDefault(); this.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
document.getElementById('dropZone').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
document.getElementById('dropZone').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); document.getElementById('fileInput').click(); }});

const loadedPkgs = {};
let curPkg = null;
const openPhases = new Set();
const openCards = new Set();
let allExpanded = false;

const COLOR_PHASE='#006666';
const COLOR_CARD='#00A63D';
const LINE_COLOR='rgba(0,102,102,0.32)';

function showErr(msg){ const b=document.getElementById('errBar'); b.textContent=msg; b.style.display='block'; setTimeout(()=>{b.style.display='none'},4000); }

function handleFiles(files){
  Array.from(files).forEach(f=>{
    if(!f.name.endsWith('.json')){ showErr(`"${f.name}" is not a JSON file.`); return; }
    const r=new FileReader();
    r.onload=e=>{
      try{
        const raw=JSON.parse(e.target.result);
        const pkg=raw.package||raw;
        const name=pkg.name||pkg.label||f.name.replace('.json','');
        loadedPkgs[name]=parsePackage(pkg,name);
        renderChips();
        selectPkg(name);
        document.getElementById('uploadArea').style.display='none';
      }catch(err){ showErr(`Could not parse "${f.name}": ${err.message}`); }
    };
    r.readAsText(f);
  });
  document.getElementById('fileInput').value='';
}

function parsePackage(pkg, name){
  const phases=[];

  const preItems=[];
  (pkg.pre_checks||[]).forEach(t=>{
    preItems.push({type:'card',label:friendlyTaskType(t.task_type)+' — '+friendlyKey(t.task_key),color:COLOR_CARD,tasks:[
      {t:`Task: ${t.task_key||'—'}  (${t.task_type||'—'})`,req:t.mandatory===true,tp:t.task_type||'pre-check'}
    ]});
  });
  if(preItems.length) phases.push({id:'pre',label:'pre-checks (automated, before call)',items:preItems});

  const captureItems=[];
  const capCfg=pkg.capture_configuration||{};
  const gpc=pkg.generic_page_configuration||{};
  (capCfg.page_sequence||[]).forEach(ps=>{
    if(ps.page==='generic_page'&&ps.page_key&&gpc[ps.page_key]){
      const ruleset=gpc[ps.page_key];
      (ruleset.rules||[]).forEach(rule=>{
        const cc=rule.capture_configuration||{};
        const nested=cc.capture||[];
        flatCapture(nested).forEach(card=>{
          captureItems.push(card);
        });
      });
    }
    if(ps.page==='capture'){
      flatCapture(capCfg.capture||[]).forEach(card=>captureItems.push(card));
    }
    if(ps.page==='av_prerequisite'){
      const pkey=ps.page_key&&gpc[ps.page_key];
      if(pkey){
        (pkey.rules||[]).forEach(r=>{
          const cc=r.capture_configuration||{};
          const items=cc.prerequisite_items||[];
          if(items.length) captureItems.push({type:'card',label:'Prerequisite checklist',color:COLOR_CARD,tasks:
            items.map(i=>({t:i,req:false,tp:'prerequisite'}))});
        });
      }
    }
  });
  if(capCfg.capture&&!capCfg.page_sequence){
    flatCapture(capCfg.capture||[]).forEach(c=>captureItems.push(c));
  }
  if(captureItems.length) phases.push({id:'capture',label:'customer capture (before joining call)',items:captureItems});

  const avCfg=pkg.assisted_vkyc_configuration||{};
  const avCapture=avCfg.capture||[];
  const avItems=[];
  flatCapture(avCapture).forEach(c=>avItems.push(c));
  if(avItems.length) phases.push({id:'av',label:'on-call — agent checklist',items:avItems});

  const reasons=pkg.assisted_vkyc_reasons||{};
  const allReasons=[...(reasons.reject||[]),...(((reasons.v2||{}).unable_to_verify)||[]).map(r=>r.code)].filter(Boolean);
  if(allReasons.length) phases.push({id:'reject',label:'rejection reasons',items:[{type:'reject',reasons:allReasons}]});

  const flags={};
  const acVal = pkg['autoclose_enabled?'];
  if(acVal != null) flags['autoclose'] = !!acVal;
  if(pkg.allow_recapture!=null) flags['allow recapture']=pkg.allow_recapture;
  if(pkg.review_enabled!=null) flags['review enabled']=pkg.review_enabled;
  if(pkg.enhanced_review_enabled!=null) flags['enhanced review']=pkg.enhanced_review_enabled;
  const rc=pkg.review_configuration||{};
  if(rc.enable_truesight!=null) flags['truesight QA']=!!rc.enable_truesight;
  const avff=pkg.assisted_vkyc_feature_flags||{};
  if(avff.combine_videos!=null) flags['combined video']=avff.combine_videos;
  const cc=avff.call_context||{};
  if(cc.enabled!=null) flags['call context']=cc.enabled;
  if(avff.modal_camera!=null) flags['modal camera']=!!(avff.modal_camera);
  const nc=pkg.network_check||(avff.network_check)||{};
  if(nc.enabled!=null) flags['network check']=nc.enabled;
  if(pkg.capture_enabled!=null) flags['capture enabled']=pkg.capture_enabled;
  if(Object.keys(flags).length) phases.push({id:'flags',label:'feature flags',items:[{type:'flags',flags}]});

  return {name, phases};
}

function flatCapture(captureArr){
  const items=[];
  if(!Array.isArray(captureArr)) return items;
  captureArr.forEach(group=>{
    const cards=Array.isArray(group)?group:[group];
    cards.forEach(card=>{
      if(!card) return;
      const tmpl=card.template||{};
      const cardTitle=tmpl.title||tmpl.label||tmpl.detail||'(card)';
      const tasks=[];
      (card.tasks||[]).forEach(t=>extractTasks(t,tasks));
      if(tasks.length||cardTitle!=='(card)'){
        items.push({type:'card',label:cardTitle,color:COLOR_CARD,tasks});
      }
    });
  });
  return items;
}

function extractTasks(t, out){
  if(!t) return;
  const tmpl=t.template||{};
  const label=tmpl.label||tmpl.title||tmpl.detail||t.task_key||t.task_type||'';
  const tp=t.task_type||tmpl.type||'';
  const isHidden=tp==='hidden';
  if(!isHidden && label){
    const isMandatory=tmpl.mandatory===true;
    const markFail=(tmpl.mark_task_failed_for||[]).length>0;
    out.push({t:buildTaskLabel(label,tmpl,tp),req:isMandatory,tp:friendlyTaskType(tp),fail:markFail});
  }
  (t.tasks||[]).forEach(sub=>extractTasks(sub,out));
}

function buildTaskLabel(label,tmpl,tp){
  let l=label;
  if(tmpl.options&&tmpl.options.length&&tmpl.options.length<=6) l+=` (${tmpl.options.join(' / ')})`;
  if(tp==='verify.random_number'&&tmpl.settings&&tmpl.settings.digits) l+=` — ${tmpl.settings.digits} digits`;
  if(tp==='compare.face_compare'&&tmpl.help_text) l=tmpl.help_text;
  return l;
}

function friendlyTaskType(tp){
  if(!tp) return '—';
  const m={
    'data_capture.data_capture':'capture','data_capture.location':'location',
    'verify.qa':'QA','verify.random_number':'random code','verify.security_question':'security Q',
    'compare.face_compare':'face compare','compare.ind_names':'name compare',
    'compare.entity_fuzzy':'fuzzy compare','compare.ind_address':'address compare',
    'extract.ind_pan':'PAN OCR','extract.poa':'POA OCR','extract.ind_aadhaar_plus':'Aadhaar OCR',
    'verify_with_source.ind_pan':'PAN database','verify_with_source.ip_address':'IP check',
    'fetch_from_digilocker.ind_aadhaar':'DigiLocker','vkyc.assisted_vkyc':'vKYC init',
    'resolve.location':'resolve location','display.section':'display','card.group':'group',
    'validate.dedupe_customer':'dedupe check','truesight.verify.verification_question':'TrueSight',
    'av_prerequisite':'prerequisite','image':'image capture','text':'text input',
    'screenshot':'screenshot','radio':'radio','dropdown':'dropdown','button':'button',
    'section':'section','card':'card','hidden':'hidden','form':'form','filepicker':'file upload'
  };
  return m[tp]||tp.split('.').pop()||tp;
}

function friendlyKey(key){
  if(!key) return '';
  return key.replace(/_/g,' ').replace(/\./g,' › ').replace(/vkyc › /,'').trim();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChips(){
  const names=Object.keys(loadedPkgs);
  const el=document.getElementById('fileChips');
  if(!names.length){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML=names.map(n=>`
    <div class="chip ${n===curPkg?'active':''}" onclick="selectPkg('${CSS.escape(n)}')" id="chip_${encodeURIComponent(n)}">
      <span>${escapeHtml(n)}</span>
      <span class="chip-remove" onclick="event.stopPropagation();removePkg('${CSS.escape(n)}')" title="Remove">✕</span>
    </div>`).join('');
  const sel=document.getElementById('pkgSel');
  sel.style.display='none';
}

function removePkg(n){
  const decoded=decodeURIComponent(n);
  delete loadedPkgs[decoded];
  if(curPkg===decoded){
    const remaining=Object.keys(loadedPkgs);
    curPkg=remaining.length?remaining[0]:null;
    openPhases.clear(); openCards.clear(); allExpanded=false;
  }
  renderChips();
  if(curPkg) renderTree();
  else {
    document.getElementById('treeRoot').innerHTML='<div class="empty-state">upload a package json file above to visualise its workflow.</div>';
    document.getElementById('uploadArea').style.display='';
    document.getElementById('expandBtn').style.display='none';
    document.getElementById('topTitle').innerHTML='vkyc.workflow_explorer<span class="cursor"></span>';
  }
}

function selectPkg(n){
  curPkg=n; openPhases.clear(); openCards.clear(); allExpanded=false;
  document.getElementById('expandBtn').textContent='expand all';
  document.getElementById('expandBtn').style.display='';
  document.getElementById('topTitle').innerHTML=escapeHtml(n)+'<span class="cursor"></span>';
  renderChips();
  renderTree();
}

function renderTree(){
  if(!curPkg||!loadedPkgs[curPkg]){
    document.getElementById('treeRoot').innerHTML='<div class="empty-state">no data.</div>';
    return;
  }
  const pkg=loadedPkgs[curPkg];
  const root=document.getElementById('treeRoot');
  let html='';
  pkg.phases.forEach((phase,pi)=>{
    const isLast=pi===pkg.phases.length-1;
    const pOpen=openPhases.has(phase.id);
    const cardCount=phase.items.filter(i=>i.type==='card').length;
    const countStr=cardCount>0?`${cardCount} card${cardCount!==1?'s':''}`:
      phase.id==='reject'?`${(phase.items[0]||{reasons:[]}).reasons.length} reasons`:'';
    html+=`<div class="phase-block">
      <div class="phase-row" onclick="togglePhase('${phase.id}')" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePhase('${phase.id}')}">
        <div class="v-line-wrap">
          <div class="v-line ${pi>0?'phase-line':'invis'}" style="height:14px"></div>
          <div class="phase-dot"></div>
          ${!isLast||pOpen?`<div class="v-line phase-line" style="flex:1;min-height:8px"></div>`:'<div style="flex:1"></div>'}
        </div>
        <div class="phase-label">${escapeHtml(phase.label)}</div>
        ${countStr?`<div class="phase-count">${countStr}</div>`:''}
        <div class="chevron ${pOpen?'open':''}">▸</div>
      </div>
      ${pOpen?`<div class="children">${renderPhaseChildren(phase,isLast)}</div>`:''}
    </div>`;
  });
  root.innerHTML=html||'<div class="empty-state">no workflow phases found in this package.</div>';
}

function renderPhaseChildren(phase,phaseIsLast){
  let html='';
  phase.items.forEach((item,ii)=>{
    const isLast=ii===phase.items.length-1;
    if(item.type==='card'){
      const key=`${phase.id}__${ii}`;
      const isOpen=openCards.has(key);
      const tc=(item.tasks||[]).length;
      html+=`<div>
        <div class="card-row" onclick="toggleCard('${key}')" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('${key}')}">
          <div class="tc-lines">
            <div class="v-line phase-line" style="height:14px"></div>
            <div style="display:flex;align-items:center;height:9px">
              <div style="width:12px;height:1px;background-image:linear-gradient(90deg, ${LINE_COLOR} 50%, transparent 50%);background-size:4px 1px"></div>
              <div class="card-dot" style="background:${item.color}"></div>
            </div>
            ${!isLast||isOpen?`<div class="v-line phase-line" style="flex:1;min-height:8px"></div>`:`<div style="flex:1"></div>`}
          </div>
          <div class="card-label ${isOpen?'open-label':''}">${escapeHtml(item.label)}</div>
          <div class="card-count">${tc} task${tc!==1?'s':''}</div>
          <div class="chevron ${isOpen?'open':''}">▸</div>
        </div>
        ${isOpen?`<div><div class="task-list">${(item.tasks||[]).map(task=>`
          <div class="task-row">
            <div class="task-dot"></div>
            <div class="task-text">${escapeHtml(task.t)}</div>
            <div class="badges">
              <span class="badge ${task.req?'b-req':'b-opt'}">${task.req?'required':'optional'}</span>
              <span class="badge b-type">${escapeHtml(task.tp)}</span>
              ${task.fail?'<span class="badge b-fail">fails call</span>':''}
            </div>
          </div>`).join('')}</div></div>`:''}
      </div>`;
    } else if(item.type==='reject'){
      html+=`<div>
        <div class="reject-list">${(item.reasons||[]).map(r=>`<span class="reject-pill">${escapeHtml(r)}</span>`).join('')}</div>
      </div>`;
    } else if(item.type==='flags'){
      html+=`<div>
        <div class="flag-list">${Object.entries(item.flags||{}).map(([k,v])=>`<span class="flag-pill ${v?'on':''}">${escapeHtml(k)}: ${v?'on':'off'}</span>`).join('')}</div>
      </div>`;
    }
  });
  return html;
}

function togglePhase(id){
  if(openPhases.has(id)) openPhases.delete(id); else openPhases.add(id);
  renderTree();
}
function toggleCard(key){
  if(openCards.has(key)) openCards.delete(key); else openCards.add(key);
  renderTree();
}
function toggleAll(){
  if(!curPkg||!loadedPkgs[curPkg]) return;
  const pkg=loadedPkgs[curPkg];
  if(!allExpanded){
    pkg.phases.forEach(p=>{
      openPhases.add(p.id);
      p.items.forEach((item,ii)=>{ if(item.type==='card') openCards.add(`${p.id}__${ii}`); });
    });
    allExpanded=true;
    document.getElementById('expandBtn').textContent='collapse all';
  } else {
    openPhases.clear(); openCards.clear(); allExpanded=false;
    document.getElementById('expandBtn').textContent='expand all';
  }
  renderTree();
}
</script>
